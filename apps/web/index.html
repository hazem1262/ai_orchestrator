<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchestrator</title>
    <!-- The Calm --background token (src/index.css) for each color scheme, as sRGB hex. -->
    <meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <!-- Applies the saved theme before first paint; src/features/theme/ThemeProvider.tsx keeps it in step. -->
    <script>
      try {
        const t = JSON.parse(localStorage.getItem('orc.theme') ?? '{}').state?.theme;
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // unreadable storage: stay light until the app mounts
      }
    </script>
    <!-- Sets window.__ORC_TOKEN__; served by the daemon to loopback same-origin requests only. -->
    <script src="/bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
